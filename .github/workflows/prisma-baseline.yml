name: Sinh lại migration gốc (một lần)

# Chạy khi có file đánh dấu app/prisma/.regenerate-baseline.
# Xoá toàn bộ migration cũ, sinh 1 migration gốc khớp đúng schema.prisma.
# CHỈ dùng trước khi có dữ liệu thật.
on:
  push:
    paths: ['app/prisma/.regenerate-baseline']

permissions:
  contents: write

jobs:
  baseline:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - name: Sinh migration gốc
        run: |
          rm -rf prisma/migrations/2026*
          mkdir -p prisma/migrations/20261027000000_baseline
          npx prisma migrate diff --from-empty --to-schema-datamodel prisma/schema.prisma --script \
            > prisma/migrations/20261027000000_baseline/migration.sql
          printf '# Please do not edit this file manually\n# It should be added in your version-control system (i.e. Git)\nprovider = "postgresql"\n' > prisma/migrations/migration_lock.toml
          rm -f prisma/.regenerate-baseline
          head -40 prisma/migrations/20261027000000_baseline/migration.sql
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A prisma
          git commit -m "chore(db): migration gốc duy nhất sinh từ schema.prisma (thay 3 migration lệch)"
          git push origin "HEAD:${GITHUB_REF_NAME}"
