name: M0 kiểm thử tự động

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  m0:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Tạo .env chỉ dùng cho kiểm thử
        run: |
          cp .env.example .env
          sed -i 's/^APP_DOMAIN=.*/APP_DOMAIN=localhost/' .env
          sed -i 's/^POSTGRES_PASSWORD=.*/POSTGRES_PASSWORD=ci-test-password-123/' .env
          sed -i 's#^DATABASE_URL=.*#DATABASE_URL=postgres://viec:ci-test-password-123@db:5432/viec#' .env
          sed -i 's/^SESSION_SECRET=.*/SESSION_SECRET=ci-test-secret-0123456789abcdefghijklmnop/' .env

      - name: Build và chạy các container
        run: docker compose up -d --build

      - name: Chờ web healthy
        run: |
          for i in $(seq 1 30); do
            s=$(docker inspect -f '{{.State.Health.Status}}' viec-app-web-1 2>/dev/null || echo none)
            if [ "$s" = "healthy" ]; then echo "web healthy"; exit 0; fi
            sleep 5
          done
          docker compose ps
          docker compose logs web --tail 50
          exit 1

      - name: Kiểm tra qua Caddy (HTTPS nội bộ)
        run: curl -fsk https://localhost/healthz

      - name: Trạng thái cuối
        if: always()
        run: docker compose ps
